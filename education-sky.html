<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nicole the Astrorium for Education</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#061a44"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="stylesheet" href="./education/education.css"></head><body class="sky-page"><header><a href="./index.html">← Education Home</a><h1>Nicole the Astrorium for Education</h1><span id="bootStatus" role="status">起動中…</span></header><main class="sky-layout"><aside aria-label="星空の基本操作"><h2>自由に星空を見る</h2><label>日時（この端末の現地時刻）<input id="date" type="datetime-local" step="1"></label><div class="actions"><button id="now">現在時刻</button><button id="sunset">日没30分前</button><button id="play" aria-pressed="false">▶ 動かす</button></div><label>時間の速さ<select id="rate"><option value="1">×1</option><option value="60" selected>×60</option><option value="600">×600</option></select></label><h2>観測地点</h2><label>地点名<input id="place" value="帯広"></label><label>緯度（北が＋）<input id="lat" type="number" min="-90" max="90" step="0.0001"></label><label>経度（東が＋）<input id="lon" type="number" min="-180" max="180" step="0.0001"></label><h2>見る方向</h2><label>方位°（北0・東90・南180・西270）<input id="az" type="number" min="0" max="360" step="1"></label><label>高度°<input id="alt" type="number" min="-20" max="90" step="1"></label><label>視野角°<input id="fov" type="number" min="20" max="150" step="1"></label><fieldset><legend>表示するもの</legend><div id="toggles"></div></fieldset><p id="inputStatus" role="status"></p><p class="hint">地平線の下の天体は見えません。昼間は太陽の光で星が見えにくくなります。</p></aside><section class="sky-stage" aria-label="星空"><canvas id="sky" aria-label="日時と観測地点に対応する星空"></canvas></section></main><script src="./education/education-app.js"></script><script src="./db-bridge.js"></script><script src="./database/db-bundle.js"></script><script src="./database-bootstrap.js"></script><script>bootAstrorium('./education/education-sky.js').catch(error=>{document.getElementById('bootStatus').textContent='起動できませんでした。ページを再読み込みしてください。';console.error(error);});</script><script src="./pwa-register.js"></script></body></html>
